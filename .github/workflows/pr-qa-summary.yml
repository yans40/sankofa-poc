name: PR QA Summary

on:
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-summary:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish QA summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.info("No pull_request attached to workflow run.");
              return;
            }

            const prNumber = prs[0].number;
            const conclusion = run.conclusion || "unknown";
            const statusIcon = conclusion === "success" ? "✅" : (conclusion === "failure" ? "❌" : "⚠️");
            const runUrl = run.html_url;
            const headSha = run.head_sha?.slice(0, 7) || "n/a";

            const body = [
              "## QA Automation Summary",
              "",
              `- CI status: ${statusIcon} \`${conclusion}\``,
              `- Commit: \`${headSha}\``,
              `- Checks run: lint + test + build`,
              `- Workflow run: ${runUrl}`,
              "",
              "QA next step:",
              "- compléter les tests manuels (happy path, edge cases, régression) avant merge."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
